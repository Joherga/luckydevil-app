name: Construir APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ordenar los archivos
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          mv -f icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/ 2>/dev/null || true
      - name: Instalar dependencias
        run: npm install
      - name: Crear el proyecto Android
        run: npx cap add android
      - name: Iconos y pantalla de inicio (si falla, se usa el icono por defecto)
        continue-on-error: true
        run: npx @capacitor/assets generate --android
      - name: Copiar la app al proyecto
        run: npx cap sync android
      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyDevil-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
