<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0605"><title>LuckyDevil</title>
<style>
:root{--bg:#0a0605;--card:#1a0d09;--line:#4a1d10;--tx:#fdf0e3;--mu:#b39a88;--g:#ff7a1a;--au:#ffc24a;--c:#ff6a1a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#5a1608,var(--bg) 62%);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;padding:12px 16px}header h1{flex:1;font-size:19px}
header b,.hero h2 b{background:linear-gradient(#ffe27a,#ff5a1a);-webkit-background-clip:text;background-clip:text;color:transparent}
header button{background:none;border:0;color:var(--tx);font-size:22px}
main{flex:1;overflow:auto;padding:0 14px 18px}
nav{display:flex;border-top:1px solid var(--line);background:#100605;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 7px;font-size:10px}
nav i{display:block;font-style:normal;font-size:19px}nav .on{color:var(--g)}
.card{background:linear-gradient(160deg,#2a120a,var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h3{font-size:13px;color:var(--au);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.mu{color:var(--mu);font-size:13px}.hero{text-align:center;padding:6px 0 4px}
.hero img{width:112px;height:112px;border-radius:26px;box-shadow:0 0 34px #ff6a1a77}
.hero h2{font-size:34px;margin-top:8px}.sl{color:var(--au);font-style:italic;margin-top:6px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 4px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:4px}
.gc .dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6,var(--c));box-shadow:0 0 14px var(--c)}
.gc b{font-size:13px}.gc small{font-size:11px;color:var(--mu)}
.chips,.tabs{display:flex;gap:8px;margin:12px 0 4px;overflow-x:auto}
.chip,.tabs button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:20px;padding:7px 14px;font-size:13px}
.chip.on{border-color:var(--c);color:var(--tx)}.tabs button.on{background:#4a1608;color:var(--au);border-color:var(--g)}
.ball{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid var(--c);background:#1a0b07;margin:2px}
.ball.x{border-color:var(--au);color:var(--au);background:#2a2208}.ball.tq{background:linear-gradient(135deg,#134e4a,#0d9488);border-color:#2dd4bf;color:#fff}
.t1{background:linear-gradient(135deg,#166534,#4ade80);border-color:#4ade80;color:#fff}
.t2{background:linear-gradient(135deg,#b45309,#facc15);border-color:#facc15;color:#111827}
.t3{background:linear-gradient(135deg,#991b1b,#ef4444);border-color:#ef4444;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:6px}.bc{display:flex;flex-direction:column;align-items:center;width:42px}.bc small{font-size:10px;color:var(--mu)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--mu)}.bar span:first-child{width:46px}
.bar i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#b91c1c,#ffb347)}.bar em{font-style:normal;width:36px;text-align:right}
.pb,.sb{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;margin-top:10px}
.pb{background:linear-gradient(135deg,#dc2626,#ff7a1a);color:#fff}.sb{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.it{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #3a170d}.it:last-child{border:0}
.it .ball{width:28px;height:28px;font-size:11px}.it small{color:var(--mu);font-size:11px;display:block}
input[type=text]{width:100%;background:#120806;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--tx);font-size:14px}
.note{font-size:11px;color:var(--mu);border:1px dashed #6b2a14;border-radius:10px;padding:8px 10px;margin-top:10px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mu);margin:8px 12px 0 0}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
details.adv summary{color:var(--au);margin-top:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#4a1608;border:1px solid var(--g);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}#toast.on{opacity:1}
</style></head><body><div id="app"><header><h1>Lucky<b>Devil</b></h1><button data-a="tab" data-v="mas" aria-label="Más">⚙</button></header><main id="main"></main><nav id="nav"></nav></div><div id="toast"></div><input type="file" id="csv" accept=".csv,.txt" hidden>

function put(g,list){const have=new Set(DB[g].map(r=>r.d));let k=0;
 for(const r of list)if(valid(g,r)&&!have.has(r.d)){have.add(r.d);DB[g].push(r);k++}
 DB[g].sort((a,b)=>b.d.localeCompare(a.d));saveDB();return k}
function fromFeed(g,arr){return(Array.isArray(arr)?arr:[]).map(e=>{const n=[...(e[1]||[])].map(Number).sort((a,b)=>a-b);let x=[],c=null;
 if(g==='pri'||g==='bon'){c=e[2]>=1&&e[2]<=49?+e[2]:null;x=e[3]==null?[]:[+e[3]]}else if(g==='eur')x=[...(e[2]||[])].map(Number).sort((a,b)=>a-b);else x=e[2]==null?[]:[+e[2]];
 return{d:String(e[0]),n,x,c}}).filter(r=>valid(g,r))}
function parseCSV(g,t){const c=G[g],out=[],seen=new Set();
 for(const line of t.replace(/^\uFEFF/,'').split(/\r?\n/)){const m=line.match(/(\d{4}-\d{2}-\d{2}|\d{1,2}[\/-]\d{1,2}[\/-]\d{4})/);if(!m)continue;
  let d=m[1];if(!/^\d{4}/.test(d)){const[a,b,y]=d.split(/[\/-]/);d=y+'-'+b.padStart(2,'0')+'-'+a.padStart(2,'0')}
  const v=(line.slice(m.index+m[1].length).match(/\d+/g)||[]).map(Number),n=v.slice(0,c.n),e=v.slice(c.n);let x=[],cp=null;
  if(g==='pri'||g==='bon'){cp=e[0]>=1&&e[0]<=49?e[0]:null;if(e[1]>=0&&e[1]<=9)x=[e[1]]}else x=e.slice(0,c.xn);
  const r={d,n:n.sort((a,b)=>a-b),x:g==='eur'?x.sort((a,b)=>a-b):x,c:cp};
  if(n.length===c.n&&valid(g,r)&&!seen.has(d)){seen.add(d);out.push(r)}}
 return out}
async function sync(manual){const u=LS.getItem('ld-feed')||FEED;
 if(!manual&&Date.now()-(+LS.getItem('ld-sync')||0)<3*36e5)return;
 try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),20000);
  const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(tm);
  if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();let n=0;K.forEach(g=>{n+=put(g,fromFeed(g,j[FK[g]]))});
  try{LS.setItem('ld-sync',String(Date.now()))}catch(e){}
  if(manual||n)toast(n?'Añadidos '+n+' sorteos nuevos':'Todo al día');render()}
 catch(e){if(manual)toast('No se pudo conectar con la fuente de datos')}}
const freq=(g,l)=>{const f={};for(let i=1;i<=G[g].m;i++)f[i]=0;l.forEach(r=>r.n.forEach(n=>f[n]++));return f};
const rank=f=>Object.keys(f).map(Number).sort((a,b)=>f[b]-f[a]||a-b);
const tier=(i,m)=>{const t=Math.ceil(m/3);return i<t?'t1':i<2*t?'t2':'t3'};
const balls=(g,d,cls='')=>d.n.map(n=>`<span class="ball ${cls}">${n}</span>`).join('')+d.x.map(x=>`<span class="ball x">${G[g].xl}${x}</span>`).join('');
const bc=(n,f,cls)=>`<div class="bc"><span class="ball ${cls}">${n}</span><small>${f}</small></div>`;
const chips=()=>'<div class="chips">'+K.map(k=>`<button class="chip ${S.g===k?'on':''}" data-a="set" data-k="g" data-v="${k}" style="--c:${G[k].c}">${G[k].nm}</button>`).join('')+'</div>';
const tabs=(it,k,cur)=>'<div class="tabs">'+it.map(([v,l])=>`<button class="${String(cur)===String(v)?'on':''}" data-a="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')+'</div>';
const empty=()=>`<div class="card"><p class="mu">Todavía no hay sorteos de ${G[S.g].nm}. Abre ⚙ Más y pulsa «Sincronizar ahora» (hace falta internet).</p></div>`;
const NOTE='<div class="note">Solo curiosidad estadística: cada sorteo es independiente y ninguna combinación aumenta tus probabilidades.</div>';
function gen(g,mode){const c=G[g],all=draws(g),rk=rank(freq(g,all.slice(0,200))),m=c.m;
 const pf=(a,k)=>{a=[...a];const o=[];while(o.length<k&&a.length)o.push(a.splice(Math.random()*a.length|0,1)[0]);return o};
 const pool=Array.from({length:m},(_,i)=>i+1);let n;
 if(mode==='rnd'||!all.length)n=pf(pool,c.n);
 else if(mode==='bal'){const a=Math.ceil(c.n/3),b=Math.ceil((c.n-a)/2),t=Math.ceil(m/3);n=[...pf(rk.slice(0,t),a),...pf(rk.slice(t,2*t),b),...pf(rk.slice(2*t),c.n-a-b)]}
 else n=pf(mode==='hot'?rk.slice(0,Math.ceil(m/2)):rk.slice(Math.floor(m/2)),c.n);
 const xs=Array.from({length:c.xm-c.x0+1},(_,i)=>i+c.x0);return{g,n:n.sort((a,b)=>a-b),x:pf(xs,c.xn).sort((a,b)=>a-b)}}
function comboHTML(g,l,f,rk,fx,cs){const c=G[g],yn=g==='eur'?1:2,nx=l.filter(r=>r.x.length).length;
 const xr=Array.from({length:c.xm-c.x0+1},(_,i)=>i+c.x0).sort((a,b)=>(fx[b]||0)-(fx[a]||0)||a-b).slice(0,c.xn);
 const nm=g==='eur'?'Estrellas':g==='dre'?'Sueño':'Reintegro';
 const sq=(bg,tx)=>`<span class="lg"><i style="background:${bg}"></i>${tx}</span>`;
 return `<div class="card" ${cs}><h3>🎯 Combinación estadística (curiosidad) · ${l.length} sorteos</h3><div class="row" style="align-items:flex-start">${rk.slice(0,3).map(n=>bc(n,f[n],'t1')).join('')}${rk.slice(17,17+yn).map(n=>bc(n,f[n],'t2')).join('')}${rk.slice(34,35).map(n=>bc(n,f[n],'t3')).join('')}<span style="width:10px"></span>${xr.map(x=>`<div class="bc"><span class="ball tq">${c.xl}${x}</span><small>${nx?((fx[x]||0)/nx*100).toFixed(1):'0.0'}%</small></div>`).join('')}</div>
 <div>${sq('linear-gradient(135deg,#166534,#4ade80)','3 primeros verdes')}${sq('linear-gradient(135deg,#b45309,#facc15)',yn===1?'primer amarillo':'2 primeros amarillos')}${sq('linear-gradient(135deg,#991b1b,#ef4444)','primer rojo')}${sq('linear-gradient(135deg,#134e4a,#0d9488)',nm+' más frecuente')}</div></div>`}
const V={
ini(){const c=G[S.g],L=draws(S.g)[0];
 return `<div class="hero"><img src="${ICON}" alt=""><h2>Lucky<b>Devil</b></h2><p class="mu">ESTADÍSTICAS · GENERADOR · HISTORIAL</p><p class="sl">La suerte también se analiza</p></div>
 <div class="games">${K.map(k=>`<button class="gc" data-a="game" data-v="${k}" style="--c:${G[k].c}"><span class="dot"></span><b>${G[k].nm}</b><small>${G[k].ds}</small></button>`).join('')}</div>
 <div class="card" style="--c:${c.c}"><h3>Último sorteo · ${c.nm}</h3>${L?`<p class="mu">${fmt(L.d)}</p>${balls(S.g,L)}`:'<p class="mu">Aún no hay sorteos guardados. Abre ⚙ Más y pulsa «Sincronizar ahora».</p>'}</div>`},
est(){const g=S.g,c=G[g],all=draws(g),l=S.scope?all.slice(0,S.scope):all;
 let h=chips()+tabs([['est','Estadísticas'],['num','Números'],['tr','Tendencias']],'sub',S.sub)+tabs([[100,'Últimos 100'],[0,'Todos']],'scope',S.scope);
 if(!l.length)return h+empty();
 const f=freq(g,l),rk=rank(f),cs=`style="--c:${c.c}"`;
 if(S.sub==='num'){const tm={};rk.forEach((n,i)=>tm[n]=tier(i,c.m));
  return h+`<div class="card" ${cs}><h3>Mapa de números</h3><div class="row">${Object.keys(f).map(n=>bc(n,f[n],tm[n])).join('')}</div><p class="mu" style="margin-top:8px">Verde: más frecuentes · ámbar: medios · rojo: menos frecuentes. Basado en ${l.length} sorteos.</p></div>`}
 if(S.sub==='tr'){if(l.length<30)return h+'<div class="card"><p class="mu">Se necesitan al menos 30 sorteos para calcular tendencias.</p></div>';
  const f20=freq(g,l.slice(0,20)),d={};rk.forEach(n=>d[n]=f20[n]/20-f[n]/l.length);const o=Object.keys(d).map(Number).sort((a,b)=>d[b]-d[a]);
  const rw=a=>`<div class="row">${a.map(n=>bc(n,f20[n]+' en 20','')).join('')}</div>`;
  return h+`<div class="card" ${cs}><h3>En racha (últimos 20)</h3>${rw(o.slice(0,6))}</div><div class="card" ${cs}><h3>Enfriándose</h3>${rw(o.slice(-6).reverse())}</div>${NOTE}`}
 const fx={};l.forEach(r=>r.x.forEach(x=>fx[x]=(fx[x]||0)+1));const tx=Object.keys(fx).sort((a,b)=>fx[b]-fx[a]).slice(0,4);
 const dec=[];for(let i=0;i<Math.ceil(c.m/10);i++)dec.push(0);l.forEach(r=>r.n.forEach(n=>dec[Math.floor((n-1)/10)]++));const tot=l.length*c.n;
 return h+comboHTML(g,l,f,rk,fx,cs)+`<div class="card" ${cs}><h3>Números más frecuentes</h3><div class="row">${rk.slice(0,6).map(n=>bc(n,f[n],'t1')).join('')}</div><p class="mu">Según los últimos ${l.length} sorteos</p></div>
 <div class="card" ${cs}><h3>Números menos frecuentes</h3><div class="row">${rk.slice(-6).reverse().map(n=>bc(n,f[n],'t3')).join('')}</div></div>
 ${tx.length?`<div class="card" ${cs}><h3>${g==='eur'?'Estrellas':g==='dre'?'Número Sueño':'Reintegro'} más frecuentes</h3><div class="row">${tx.map(x=>`<div class="bc"><span class="ball x">${x}</span><small>${fx[x]}</small></div>`).join('')}</div></div>`:''}
 <div class="card" ${cs}><h3>Distribución por decenas</h3>${dec.map((v,i)=>`<div class="bar"><span>${i*10+1}-${Math.min(c.m,i*10+10)}</span><i style="width:${v/tot*220}px"></i><em>${Math.round(v/tot*100)}%</em></div>`).join('')}</div>${NOTE}`},
gen(){const c=G[S.g];let h=chips()+tabs([['rnd','Aleatorio'],['per','Personalizado']],'gen',S.gen);
 if(S.gen==='per')h+=tabs([['hot','Calientes'],['bal','Equilibrada'],['cold','Fríos']],'strat',S.strat);
 const p=S.gp&&S.gp.g===S.g?S.gp:null;
 return h+`<div class="card" style="--c:${c.c}"><h3>${c.nm} · ${c.ds}</h3>${p?`<div class="row">${balls(S.g,p)}</div>`:'<p class="mu">Pulsa «Generar nueva» para crear una combinación.</p>'}</div>
 <button class="pb" data-a="gen">Generar nueva</button>${p?'<button class="sb" data-a="fav">☆ Añadir a favoritos</button>':''}<button class="sb" data-a="tab" data-v="his">Ver historial</button>${NOTE}`},
his(){const l=draws(S.g);let h=chips();if(!l.length)return h+empty();
 return h+`<div class="card" style="--c:${G[S.g].c}">${l.slice(0,S.hn).map(r=>`<div class="it"><div><b>${fmt(r.d)}</b><small>${['dom','lun','mar','mié','jue','vie','sáb'][new Date(r.d+'T12:00').getDay()]}</small></div><div class="row" style="justify-content:flex-end">${balls(S.g,r)}</div></div>`).join('')}</div>${l.length>S.hn?'<button class="sb" data-a="more">Ver más</button>':''}`},
fav(){let h=tabs([['c','Combinaciones'],['s','Estadísticas']],'fs',S.fs);if(!FAV.length)return h+'<div class="card"><p class="mu">Aún no has guardado combinaciones. Créalas en el Generador.</p></div>';
 return h+FAV.map((f,i)=>{const c=G[f.g];let body;
  if(S.fs==='c')body=`<div class="row">${balls(f.g,f)}</div><button class="sb" data-a="del" data-v="${i}">Eliminar</button>`;
  else{let best=0,bd='',n3=0;draws(f.g).forEach(r=>{const k=r.n.filter(x=>f.n.includes(x)).length;if(k>best){best=k;bd=r.d}if(k>=3)n3++});
   body=`<div class="row">${balls(f.g,f)}</div><p class="mu" style="margin-top:6px">Mejor resultado histórico: ${best} aciertos${bd?' ('+fmt(bd)+')':''} · con 3 o más: ${n3} sorteos</p>`}
  return `<div class="card" style="--c:${c.c}"><h3>Mi combinación ${i+1} · ${c.nm}</h3>${body}</div>`}).join('')},
mas(){const sy=+LS.getItem('ld-sync')||0;
 return `<div class="card"><h3>Datos</h3><p class="mu">Los sorteos se actualizan solos al abrir la app.</p><p class="mu" style="margin-top:4px">Última sincronización: ${sy?new Date(sy).toLocaleString('es-ES'):'nunca'}</p><button class="pb" data-a="sync">Sincronizar ahora</button>
 <details class="adv" ${S.adv?'open':''}><summary>Opciones avanzadas</summary><p class="mu" style="margin-top:8px">URL de la fuente de datos</p><input type="text" id="feed" value="${LS.getItem('ld-feed')||FEED}"><button class="sb" data-a="savefeed">Guardar URL</button>
 <p class="mu" style="margin-top:12px">Importar CSV en el juego seleccionado:</p>${chips()}<button class="sb" data-a="csv">Importar CSV de ${G[S.g].nm}</button></details></div>
 <div class="card"><h3>Aviso responsable</h3><p class="mu">La suerte no se puede predecir. Juega con responsabilidad. Esta app es solo una herramienta de curiosidad estadística. Para mayores de 18 años. LuckyDevil no vende ni gestiona apuestas y no está afiliada a Loterías y Apuestas del Estado (SELAE); La Primitiva, Bonoloto, Euromillones y EuroDreams son marcas de sus titulares.</p></div>
 <div class="card"><h3>Estado de la app</h3>${K.map(g=>{const l=draws(g);return `<div class="it"><span>${G[g].nm}</span><span class="mu">${l.length?l.length+' sorteos · '+fmt(l[0].d):'sin datos'}</span></div>`}).join('')}</div>`}};
const NAV=[['ini','🏠','Inicio'],['est','📊','Estadísticas'],['gen','🎲','Generador'],['his','🕘','Historial'],['fav','⭐','Favoritos']];
function render(){$('#main').innerHTML=V[S.tab]();$('#nav').innerHTML=NAV.map(([t,i,l])=>`<button class="${S.tab===t?'on':''}" data-a="tab" data-v="${t}"><i>${i}</i>${l}</button>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='tab'){S.tab=v;render();$('#main').scrollTop=0;return}
 if(a==='game'){S.g=v;S.gp=null;S.tab='est';render();return}
 if(a==='set'){S[b.dataset.k]=b.dataset.k==='scope'?+v:v;if(b.dataset.k==='g')S.gp=null;render();return}
 if(a==='gen'){S.gp=gen(S.g,S.gen==='rnd'?'rnd':S.strat)}
 else if(a==='fav'&&S.gp){FAV.push({g:S.gp.g,n:S.gp.n,x:S.gp.x});saveFav();toast('Añadida a favoritos')}
 else if(a==='del'){FAV.splice(+v,1);saveFav()}
 else if(a==='more'){S.hn+=40}
 else if(a==='sync'){sync(true);return}
 else if(a==='savefeed'){const x=($('#feed').value||'').trim();try{x?LS.setItem('ld-feed',x):LS.removeItem('ld-feed')}catch(_){}toast('URL guardada');sync(true);return}
 else if(a==='csv'){$('#csv').click();return}
 render()});
$('#csv').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=parseCSV(S.g,await f.text());toast(d.length?'Añadidos '+put(S.g,d)+' sorteos nuevos':'Formato no reconocido');render()}catch(_){toast('No se pudo leer el archivo')}e.target.value=''});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.adv'))S.adv=e.target.open},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(false)});
render();sync(false);
</script></body></html>
